[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-payments"
dynamic = ["version"]
description = "Policy-first, multi-rail payment protocol for Hermes agents."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=7.0,<9.0",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "hermes_payments.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
